name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # --------------------------------------------------------------------------
  # Backend: lint, typecheck, test, security scan
  # --------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: |
          python -m ruff check pokequant
          python -m ruff format --check pokequant

      - name: Type check (mypy)
        run: python -m mypy pokequant

      - name: Unit tests (pytest)
        run: python -m pytest --tb=short -q

      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --strict --desc on 2>&1 || true
        # Non-blocking for now; will be made strict once all deps are clean.

  # --------------------------------------------------------------------------
  # Frontend: typecheck, lint, build
  # --------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # --------------------------------------------------------------------------
  # Docker: build image (no push, just verify it builds)
  # --------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
