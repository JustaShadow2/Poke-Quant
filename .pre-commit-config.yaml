# Fast local guardrails. Install with: pipx install pre-commit && pre-commit install
# Python hooks are scoped to apps/api (the Python package lives there).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (apps/api)
        entry: bash -c 'cd apps/api && mypy pokequant'
        language: system
        types: [python]
        pass_filenames: false
        files: ^apps/api/.*\.py$
